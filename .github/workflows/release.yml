# タグ（v1.2.3 など）をpushすると、テストを通してから各OS向けのバイナリをビルドし、
# GitHub Releaseに添付する。手動実行（workflow_dispatch）では既存のタグを指定して作り直せる。
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースするタグ（例 v1.0.0。既にpush済みのもの）"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # テスト・クロスビルド・アーカイブ作成は Makefile にまとめてある（手元でも同じく make dist で再現できる）
      - name: テストとビルド
        run: make dist VERSION="$TAG"

      - name: Releaseに添付
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
