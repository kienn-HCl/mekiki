name = "rss"
opml_path = "feeds/rss.opml"
webhook_env = "RSS_DISCORD_WEBHOOK_URL"

hours_back = 24
pick_count = 20
embed_color = 0x2ECC71
header_title = "RSS注目記事ピックアップ"

user_memory_path = "user_memory.txt"

cache_path = ".cache/rss.json"

[prompts]
select_criteria = """
- 幅広いカテゴリから選ぶようにしてください（1カテゴリに偏らない）
- 技術的に興味深いもの、実務に役立つもの、業界動向として重要なものを優先してください
"""

[limits]
embeds_per_message = 5
