<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{if .Title}}{{.Title}} — {{end}}mekiki</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">目利き <small>mekiki</small></a>
  <nav>
    <a href="/" class="{{if eq .Nav "day"}}active{{end}}">今日</a>
    <a href="/archive" class="{{if eq .Nav "archive"}}active{{end}}">アーカイブ</a>
    <a href="/articles" class="{{if eq .Nav "articles"}}active{{end}}">RSS</a>
    <a href="/feeds" class="{{if eq .Nav "feeds"}}active{{end}}">フィード</a>
    <a href="/runs" class="{{if eq .Nav "runs"}}active{{end}}">履歴</a>
    <a href="/settings" class="{{if eq .Nav "settings"}}active{{end}}">設定</a>
  </nav>
</header>
{{if or .Status.Fetching .Status.Digesting}}
<div class="busy" id="busy" data-busy="1">
  <span class="spinner"></span>
  {{if .Status.Digesting}}要約実行中です。完了すると自動で再読み込みします…{{else}}フィードを取得中です…{{end}}
</div>
{{end}}
<main>
{{if .Flash}}<div class="flash ok">{{.Flash}}</div>{{end}}
{{if .Error}}<div class="flash err">{{.Error}}</div>{{end}}
{{template "content" .}}
</main>
<footer class="foot">mekiki — RSSをAIが目利きして要約する</footer>
<script src="/static/app.js"></script>
</body>
</html>
